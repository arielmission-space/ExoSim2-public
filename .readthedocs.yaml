# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # setuptools-scm needs the tags (and full history) to resolve the version;
      # Read the Docs checks out a shallow clone by default.
      - git fetch --tags --unshallow || git fetch --tags || true
    post_install:
      # Install all needed extras including docs (which contains sphinx-design)
      - pip install -e ".[dev,docs]"

sphinx:
  configuration: docs/source/conf.py

# Build multiple documentation formats
formats:
  - pdf
  - epub
